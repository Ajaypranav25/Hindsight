name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Unit, property and conformance tests; fails below the coverage thresholds in vitest.config.ts.
      - run: npm run coverage
      - run: npm run build
      - run: npm run build:page

  perf:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:perf

  # The extension's glue imports `vscode`, so it is type-checked and smoke-tested here, with the
  # extension's own dependencies; its vscode-free modules are covered by the check job.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run smoke

  # The download website (website/): type-checked and built with its own dependencies.
  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # The desktop app (desktop/): packed and driven by its end-to-end tests on each system, through
  # the unpacked app electron-builder makes. On main, and on demand, it also builds the installers.
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            app: release/linux-unpacked/hindsight-desktop
          - os: windows-latest
            app: release/win-unpacked/Hindsight.exe
          # macos-latest runs on Apple Silicon.
          - os: macos-latest
            app: release/mac-arm64/Hindsight.app/Contents/MacOS/Hindsight
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder skips macOS signing on pull requests unless told otherwise; the ad hoc
      # signature uses no secrets, so there is nothing to protect.
      CSC_FOR_PULL_REQUEST: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm run build:studio
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      - run: npm run pack
        working-directory: desktop
      - name: Install the libraries Electron needs
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: End-to-end tests against the packed app
        working-directory: desktop
        env:
          HINDSIGHT_DESKTOP_APP: ${{ matrix.app }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run e2e
          else
            npm run e2e
          fi
      - name: Check the ad hoc signatures (Intel and Apple Silicon)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          for app in release/mac/Hindsight.app release/mac-arm64/Hindsight.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | tee signature.txt
            grep -q '^Signature=adhoc$' signature.txt
          done
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-results-${{ runner.os }}
          path: desktop/test-results/
          retention-days: 7
      - name: Build the installers
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: desktop
        run: npm run dist
      - name: Check the installers' ad hoc signatures
        if: runner.os == 'macOS' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        working-directory: desktop
        run: |
          for app in release/mac/Hindsight.app release/mac-arm64/Hindsight.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | tee signature.txt
            grep -q '^Signature=adhoc$' signature.txt
          done
      - if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: hindsight-installers-${{ runner.os }}
          path: |
            desktop/release/Hindsight-Setup-x64.exe
            desktop/release/Hindsight-mac-*.dmg
            desktop/release/Hindsight-mac-*.zip
            desktop/release/Hindsight-linux-x86_64.AppImage
            desktop/release/Hindsight-linux-amd64.deb
          if-no-files-found: error
          retention-days: 14
