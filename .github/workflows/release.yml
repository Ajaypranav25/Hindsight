name: Release

# Publishes hindsight-lang to npm when a version tag (v0.4.0, …) is pushed. The tag must match the
# version in package.json; the package carries a provenance statement linking it to this run.
# It signs in to npm with trusted publishing (OIDC, the id-token permission below): npm trusts this
# workflow file in this repository, so there is no npm token to store or renew.
#
# The same tag also builds the desktop app's installers on Windows, macOS and Linux (the tag must
# match desktop/package.json too), after running the desktop end-to-end tests against the packed
# app on each system, and publishes them, with SHA256SUMS.txt, as the tag's GitHub release. No
# signing secrets are involved: Windows and Linux builds are unsigned, macOS builds are signed ad
# hoc (desktop/README.md).
#
# Nothing becomes public until everything has built and passed: npm publishing waits for the
# desktop builds, and the GitHub release waits for both. A tag with a hyphen (v0.6.0-rc.1) makes a
# prerelease, which never becomes the "latest" release the download links point to.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json ($version)"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Update npm for trusted publishing
        run: npm install --global npm@11
      - run: npm publish --provenance --access public

  # The desktop app's installers, built on each system from the tagged commit once the packed app
  # has passed the same end-to-end tests as in CI.
  desktop:
    name: Desktop installers (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            app: release/linux-unpacked/hindsight-desktop
          - os: windows-latest
            app: release/win-unpacked/Hindsight.exe
          # macos-latest runs on Apple Silicon.
          - os: macos-latest
            app: release/mac-arm64/Hindsight.app/Contents/MacOS/Hindsight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Check that the tag matches desktop/package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./desktop/package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match desktop/package.json ($version)"
            exit 1
          fi
      - run: npm ci
      - run: npm run build:studio
      - run: npm ci
        working-directory: desktop
      - run: npm run typecheck
        working-directory: desktop
      # The unpacked app keeps the debugger switch Playwright drives it through; the installers
      # do not, so the tests run here, before they are built.
      - run: npm run pack
        working-directory: desktop
      - name: Install the libraries Electron needs
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: End-to-end tests against the packed app
        working-directory: desktop
        env:
          HINDSIGHT_DESKTOP_APP: ${{ matrix.app }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' npm run e2e
          else
            npm run e2e
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-results-${{ runner.os }}
          path: desktop/test-results/
          retention-days: 7
      - run: npm run dist
        working-directory: desktop
      - name: Check the ad hoc signatures (Intel and Apple Silicon)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          for app in release/mac/Hindsight.app release/mac-arm64/Hindsight.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | tee signature.txt
            grep -q '^Signature=adhoc$' signature.txt
          done
      # The download site links to these exact names; a missing one fails the release.
      - name: Collect the installers
        run: |
          case "$RUNNER_OS" in
            Windows) files='Hindsight-Setup-x64.exe' ;;
            macOS) files='Hindsight-mac-arm64.dmg Hindsight-mac-x64.dmg Hindsight-mac-arm64.zip Hindsight-mac-x64.zip' ;;
            Linux) files='Hindsight-linux-x86_64.AppImage Hindsight-linux-amd64.deb' ;;
          esac
          mkdir installers
          for file in $files; do
            if [ ! -f "desktop/release/$file" ]; then
              echo "::error::desktop/release/$file was not built"
              exit 1
            fi
            cp "desktop/release/$file" installers/
          done
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: installers/
          if-no-files-found: error
          retention-days: 14

  # One GitHub release per tag, with every installer and their checksums. The download site links
  # to releases/latest/download/<name>, so the release is published, not a draft; a prerelease
  # (a tag with a hyphen) is marked so, and never becomes the latest.
  github-release:
    name: GitHub release
    needs: [desktop, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Write SHA256SUMS.txt
        working-directory: installers
        run: |
          sha256sum Hindsight-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # A re-run replaces the assets of the release the first run made.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" installers/* --clobber
          else
            # A tag with a hyphen (v0.6.0-rc.1) is a prerelease, never the latest.
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}" \
              --title "Hindsight $TAG" installers/*
          fi
