name: Release

# Publishes hindsight-lang to npm when a version tag (v0.4.0, …) is pushed. The tag must match the
# version in package.json; the package carries a provenance statement linking it to this run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json ($version)"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
